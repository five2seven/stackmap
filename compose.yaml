---
services:
  stackmap:
    build:
      context: .
      dockerfile: Dockerfile
    image: stackmap:local
    init: true
    container_name: stackmap
    environment:
      - TZ=${TZ:-America/Chicago}
      - STACKMAP_DB_PATH=/config/stackmap.db
      - STACKMAP_PORTAINER_URL=${STACKMAP_PORTAINER_URL:-}
    ports:
      - "${STACKMAP_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    read_only: true
    volumes:
      - ${STACKMAP_CONFIG_DIR:-./config}:/config
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
