---
services:
  stackmap:
    build:
      context: .
      dockerfile: Dockerfile
    image: stackmap:local
    init: true
    container_name: stackmap
    environment:
      - TZ=${TZ:-America/Chicago}
    ports:
      - "${STACKMAP_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
