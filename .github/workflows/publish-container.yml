name: Build and publish container image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/five2seven/stackmap

jobs:
  container:
    name: Build, test, and publish container
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate application cutover
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run lint
          npm test
          npm run build
          npm run test:e2e
          npm audit --omit=dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local validation image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: stackmap:validation
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        shell: bash
        run: |
          set -euo pipefail
          config_directory="$(mktemp -d)"
          chmod 0777 "$config_directory"

          diagnostics() {
            set +e
            echo "::group::StackMap container diagnostics"
            docker ps -a --filter "name=^/stackmap-validation$" --no-trunc
            if docker inspect stackmap-validation >/dev/null 2>&1; then
              docker inspect --format='state={{.State.Status}} exitCode={{.State.ExitCode}} error={{json .State.Error}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' stackmap-validation
              echo "Health-check history:"
              docker inspect --format='{{if .State.Health}}{{range .State.Health.Log}}{{println "exitCode=" .ExitCode "output=" (json .Output)}}{{end}}{{else}}No health-check history available.{{end}}' stackmap-validation
              echo "Application logs:"
              docker logs stackmap-validation
            fi
            echo "Config directory and SQLite file permissions:"
            stat --format='%A %u:%g %n' "$config_directory"
            find "$config_directory" -maxdepth 1 -type f \
              \( -name 'stackmap.db' -o -name 'stackmap.db-wal' -o -name 'stackmap.db-shm' \) \
              -exec stat --format='%A %u:%g %n' {} +
            echo "::endgroup::"
            set -e
          }

          cleanup() {
            exit_code=$?
            trap - EXIT
            if [ "$exit_code" -ne 0 ]; then diagnostics; fi
            docker rm --force stackmap-validation >/dev/null 2>&1 || true
            rm -rf "$config_directory"
            exit "$exit_code"
          }

          wait_for_health() {
            for attempt in {1..30}; do
              state="$(docker inspect --format='{{.State.Status}}' stackmap-validation 2>/dev/null || true)"
              health="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' stackmap-validation 2>/dev/null || true)"
              echo "Health attempt ${attempt}/30: state=${state:-missing} health=${health:-missing}"
              case "$state" in
                exited|dead)
                  echo "Container exited before becoming healthy."
                  return 1
                  ;;
              esac
              case "$health" in
                healthy)
                  return 0
                  ;;
                unhealthy)
                  echo "Container reported unhealthy."
                  return 1
                  ;;
                starting)
                  ;;
                *)
                  echo "Container health state is unavailable."
                  return 1
                  ;;
              esac
              sleep 2
            done
            echo "Timed out waiting for the container to become healthy."
            return 1
          }

          trap cleanup EXIT
          docker run --detach --name stackmap-validation --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true --mount "type=bind,source=$config_directory,target=/config" --publish 8088:8080 stackmap:validation
          wait_for_health

          curl --fail --silent --show-error http://127.0.0.1:8088/ --output /tmp/stackmap-index.html
          asset_path="$(grep -oE '/assets/[^\" ]+\.js' /tmp/stackmap-index.html | head -n 1)"
          css_path="$(grep -oE '/assets/[^\" ]+\.css' /tmp/stackmap-index.html | head -n 1)"
          test -n "$asset_path"
          test -n "$css_path"
          curl --fail --silent --show-error "http://127.0.0.1:8088${asset_path}" --output /dev/null
          curl --fail --silent --show-error "http://127.0.0.1:8088${css_path}" --output /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8088/services/example --output /tmp/stackmap-fallback.html
          grep --quiet '<div id="root"></div>' /tmp/stackmap-fallback.html
          test "$(docker inspect --format='{{.Config.User}}' stackmap-validation)" = "10001:10001"
          docker exec stackmap-validation node -e "const fs=require('node:fs'); fs.accessSync('/config/stackmap.db', fs.constants.W_OK)"

          installation_id="$(curl --fail --silent --show-error http://127.0.0.1:8088/api/v1/meta | node -e "process.stdin.on('data',d=>process.stdout.write(JSON.parse(d).installationId))")"
          test -n "$installation_id"
          docker exec --interactive stackmap-validation node <<'NODE'
          const Database = require('better-sqlite3')
          const db = new Database('/config/stackmap.db', { readonly: true })
          const expectedTables = [
            'application_metadata',
            'hosts',
            'legacy_migration_receipt',
            'schema_migrations',
            'service_dependencies',
            'service_paths',
            'service_ports',
            'services',
          ]
          const actualTables = db
            .prepare("SELECT name FROM sqlite_master WHERE type = 'table' ORDER BY name")
            .pluck()
            .all()
          const metadataKeys = db
            .prepare('SELECT key FROM application_metadata ORDER BY key')
            .pluck()
            .all()
          const expectedMetadataKeys = ['created_at', 'installation_id', 'inventory_revision']
          const schemaVersion = db.prepare('SELECT MAX(version) FROM schema_migrations').pluck().get()
          const inventoryRevision = db
            .prepare("SELECT value FROM application_metadata WHERE key = 'inventory_revision'")
            .pluck()
            .get()
          const inventoryTables = [
            'hosts',
            'services',
            'service_ports',
            'service_paths',
            'service_dependencies',
          ]
          const inventoryCounts = Object.fromEntries(
            inventoryTables.map((table) => [
              table,
              db.prepare(`SELECT COUNT(*) FROM ${table}`).pluck().get(),
            ]),
          )
          db.close()

          const assertEqual = (actual, expected, label) => {
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              throw new Error(`${label}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`)
            }
          }
          assertEqual(actualTables, expectedTables, 'current table set')
          assertEqual(schemaVersion, 3, 'Task 6 schema version')
          assertEqual(metadataKeys, expectedMetadataKeys, 'Task 2 application metadata keys')
          assertEqual(inventoryRevision, '0', 'fresh inventory revision')
          assertEqual(
            inventoryCounts,
            Object.fromEntries(inventoryTables.map((table) => [table, 0])),
            'fresh inventory table counts',
          )
          NODE
          node <<'NODE' >/tmp/stackmap-legacy.json
          const timestamp = '2026-08-04T00:00:00.000Z'
          process.stdout.write(JSON.stringify({ schemaVersion: 3, exportedAt: timestamp,
            hosts: [{ id: 'legacy-host', name: 'Legacy host', type: 'nas', ipAddress: '192.0.2.20', operatingSystem: 'Linux', notes: 'legacy host notes', createdAt: timestamp, updatedAt: timestamp }],
            services: [
              { id: 'legacy-dependency', name: 'Legacy dependency', containerName: 'legacy-dependency', dockerImage: 'example/dependency:1', description: '', applicationUrl: '', status: 'active', internalUrl: '', ports: [], paths: [], network: 'legacy', exposure: 'local', dependencyIds: [], notes: '', createdAt: timestamp, updatedAt: timestamp },
              { id: 'legacy-service', name: 'Legacy service', containerName: 'legacy-service', dockerImage: 'example/legacy:1', description: 'migration proof', applicationUrl: 'https://legacy.example.test', status: 'active', hostId: 'legacy-host', internalUrl: 'http://legacy-service:80', ports: [{ id: 'http', hostPort: 8081, containerPort: 80, protocol: 'tcp', description: 'HTTP' }, { id: 'dns', hostPort: 5353, containerPort: 53, protocol: 'udp', description: 'DNS' }], paths: [{ id: 'config', hostPath: '/srv/legacy', containerPath: '/config', purpose: 'Configuration', readOnly: true }, { id: 'data', hostPath: '/srv/legacy-data', containerPath: '/data', purpose: 'Data', readOnly: false }], network: 'legacy', exposure: 'reverse-proxy', dependencyIds: ['legacy-dependency'], notes: 'legacy service notes', createdAt: timestamp, updatedAt: timestamp },
            ],
          }))
          NODE
          curl --fail --silent --show-error -H 'content-type: application/json' --data-binary @/tmp/stackmap-legacy.json http://127.0.0.1:8088/api/v1/legacy-migration/preview >/tmp/legacy-preview.json
          node <<'NODE' >/tmp/legacy-confirm.json
          const preview = require('/tmp/legacy-preview.json').data
          const legacyData = require('/tmp/stackmap-legacy.json')
          process.stdout.write(JSON.stringify({ previewToken: preview.previewToken, expectedInventoryRevision: preview.expectedInventoryRevision, acknowledged: true, legacyData }))
          NODE
          curl --fail --silent --show-error -H 'content-type: application/json' --data-binary @/tmp/legacy-confirm.json http://127.0.0.1:8088/api/v1/legacy-migration/confirm >/tmp/legacy-result.json
          curl --fail --silent --show-error -H 'content-type: application/json' --data-binary @/tmp/stackmap-legacy.json http://127.0.0.1:8088/api/v1/legacy-migration/status >/tmp/legacy-status.json
          node <<'NODE'
          const assert = require('node:assert/strict')
          const preview = require('/tmp/legacy-preview.json').data
          const result = require('/tmp/legacy-result.json').data
          const status = require('/tmp/legacy-status.json').data
          assert.deepEqual(preview.summary, { legacySchemaVersion: 3, legacyExportedAt: '2026-08-04T00:00:00.000Z', hostCount: 1, serviceCount: 2, portCount: 2, pathCount: 2, dependencyCount: 1 })
          assert.equal(preview.expectedInventoryRevision, 0)
          assert.match(preview.previewToken, /^[A-Za-z0-9_-]+$/)
          assert.equal(result.inventoryRevision, 1)
          assert.deepEqual(result.summary, preview.summary)
          assert.deepEqual(status, { status: 'matched' })
          NODE
          docker exec --interactive stackmap-validation node <<'NODE'
          const assert = require('node:assert/strict')
          const Database = require('better-sqlite3')
          const db = new Database('/config/stackmap.db', { readonly: true })
          const host = db.prepare("SELECT * FROM hosts WHERE id='legacy-host'").get()
          const service = db.prepare("SELECT * FROM services WHERE id='legacy-service'").get()
          assert.deepEqual(host, { id: 'legacy-host', name: 'Legacy host', type: 'nas', ip_address: '192.0.2.20', operating_system: 'Linux', notes: 'legacy host notes', revision: 1, created_at: '2026-08-04T00:00:00.000Z', updated_at: '2026-08-04T00:00:00.000Z' })
          assert.deepEqual(service, { id: 'legacy-service', name: 'Legacy service', container_name: 'legacy-service', docker_image: 'example/legacy:1', description: 'migration proof', application_url: 'https://legacy.example.test', status: 'active', host_id: 'legacy-host', internal_url: 'http://legacy-service:80', network: 'legacy', exposure: 'reverse-proxy', notes: 'legacy service notes', revision: 1, created_at: '2026-08-04T00:00:00.000Z', updated_at: '2026-08-04T00:00:00.000Z' })
          assert.deepEqual(db.prepare("SELECT id,host_port,container_port,protocol,description FROM service_ports WHERE service_id='legacy-service' ORDER BY position").all(), [{ id: 'http', host_port: 8081, container_port: 80, protocol: 'tcp', description: 'HTTP' }, { id: 'dns', host_port: 5353, container_port: 53, protocol: 'udp', description: 'DNS' }])
          assert.deepEqual(db.prepare("SELECT id,host_path,container_path,purpose,read_only FROM service_paths WHERE service_id='legacy-service' ORDER BY position").all(), [{ id: 'config', host_path: '/srv/legacy', container_path: '/config', purpose: 'Configuration', read_only: 1 }, { id: 'data', host_path: '/srv/legacy-data', container_path: '/data', purpose: 'Data', read_only: 0 }])
          assert.deepEqual(db.prepare("SELECT dependency_id FROM service_dependencies WHERE service_id='legacy-service'").pluck().all(), ['legacy-dependency'])
          const receipt = db.prepare('SELECT fingerprint, imported_at, inventory_revision, legacy_schema_version FROM legacy_migration_receipt WHERE singleton=1').get()
          assert.match(receipt.fingerprint, /^[0-9a-f]{64}$/)
          assert.equal(receipt.inventory_revision, 1)
          assert.equal(receipt.legacy_schema_version, 3)
          assert.ok(!Number.isNaN(Date.parse(receipt.imported_at)))
          db.close()
          NODE
          migration_receipt_before_restart="$(docker exec stackmap-validation node -e "const Database=require('better-sqlite3');const db=new Database('/config/stackmap.db',{readonly:true});process.stdout.write(JSON.stringify(db.prepare('SELECT * FROM legacy_migration_receipt').get()))")"
          node <<'NODE' >/tmp/stackmap-host.json
          const timestamp = '2026-08-04T00:00:00.000Z'
          process.stdout.write(JSON.stringify({
            id: 'ci-host', name: 'CI host', type: 'nas', ipAddress: '192.0.2.10',
            operatingSystem: 'Linux', notes: '', createdAt: timestamp, updatedAt: timestamp,
          }))
          NODE
          curl --fail --silent --show-error -H 'content-type: application/json' --data-binary @/tmp/stackmap-host.json http://127.0.0.1:8088/api/v1/hosts >/tmp/created-host.json
          node <<'NODE' >/tmp/stackmap-dependency.json
          const timestamp = '2026-08-04T00:00:00.000Z'
          process.stdout.write(JSON.stringify({
            id: 'ci-dependency', name: 'CI dependency', containerName: 'ci-dependency', dockerImage: 'example/dependency:1',
            description: 'Dependency persistence proof', applicationUrl: '', status: 'active', internalUrl: '',
            ports: [], paths: [], network: 'backend', exposure: 'local', dependencyIds: [], notes: 'dependency notes',
            createdAt: timestamp, updatedAt: timestamp,
          }))
          NODE
          curl --fail --silent --show-error -H 'content-type: application/json' --data-binary @/tmp/stackmap-dependency.json http://127.0.0.1:8088/api/v1/services >/tmp/created-dependency.json
          node <<'NODE' >/tmp/stackmap-service.json
          const timestamp = '2026-08-04T00:00:00.000Z'
          process.stdout.write(JSON.stringify({
            id: 'ci-service', name: 'CI service', containerName: 'ci-service', dockerImage: 'example/ci:1',
            description: 'Container persistence proof', applicationUrl: 'https://ci.example.test', status: 'active', hostId: 'ci-host',
            internalUrl: 'http://ci-service:80',
            ports: [
              { id: 'web-http', hostPort: 8080, containerPort: 80, protocol: 'tcp', description: 'HTTP' },
              { id: 'discovery', hostPort: 1900, containerPort: 1900, protocol: 'udp', description: 'Discovery' },
            ],
            paths: [
              { id: 'config', hostPath: '/srv/ci/config', containerPath: '/config', purpose: 'Configuration', readOnly: false },
              { id: 'media', hostPath: '/srv/ci/media', containerPath: '/media', purpose: 'Media', readOnly: true },
            ],
            network: 'ci', exposure: 'reverse-proxy', dependencyIds: ['ci-dependency'], notes: 'primary notes',
            createdAt: timestamp, updatedAt: timestamp,
          }))
          NODE
          curl --fail --silent --show-error -H 'content-type: application/json' --data-binary @/tmp/stackmap-service.json http://127.0.0.1:8088/api/v1/services >/tmp/created-service.json
          created_at_before_restore="$(docker exec stackmap-validation node -e "const Database=require('better-sqlite3'); const db=new Database('/config/stackmap.db',{readonly:true}); process.stdout.write(db.prepare(\"SELECT value FROM application_metadata WHERE key = 'created_at'\").pluck().get())")"
          curl --fail --silent --show-error http://127.0.0.1:8088/api/v1/backup >/tmp/stackmap-backup.json
          restore_revision_before="$(node -e "const b=require('/tmp/stackmap-backup.json'); process.stdout.write(String(b.metadata.sourceInventoryRevision))")"
          restore_installation_before="$(node -e "const b=require('/tmp/stackmap-backup.json'); process.stdout.write(b.metadata.sourceInstallationId)")"
          test "$restore_installation_before" = "$installation_id"
          curl --fail --silent --show-error -H 'content-type: application/json' --data-binary @/tmp/stackmap-backup.json http://127.0.0.1:8088/api/v1/restore/preview >/tmp/restore-preview.json
          node <<'NODE' >/tmp/restore-confirm.json
          const preview = require('/tmp/restore-preview.json').data
          process.stdout.write(JSON.stringify({
            previewToken: preview.previewToken,
            expectedInventoryRevision: preview.expectedInventoryRevision,
          }))
          NODE
          curl --fail --silent --show-error -H 'content-type: application/json' --data-binary @/tmp/restore-confirm.json http://127.0.0.1:8088/api/v1/restore/confirm >/tmp/restore-result.json
          created_at_after_restore="$(docker exec stackmap-validation node -e "const Database=require('better-sqlite3'); const db=new Database('/config/stackmap.db',{readonly:true}); process.stdout.write(db.prepare(\"SELECT value FROM application_metadata WHERE key = 'created_at'\").pluck().get())")"
          test "$created_at_after_restore" = "$created_at_before_restore"
          RESTORE_REVISION_BEFORE="$restore_revision_before" node <<'NODE'
          const assert = require('node:assert/strict')
          const preview = require('/tmp/restore-preview.json').data
          const restored = require('/tmp/restore-result.json').data
          const before = Number(process.env.RESTORE_REVISION_BEFORE)
          assert.equal(preview.expectedInventoryRevision, before)
          assert.equal(restored.inventoryRevision, before + 1)
          assert.deepEqual(restored.summary, preview.summary)
          NODE
          assert_inventory() {
            local phase="$1"
            curl --fail --silent --show-error http://127.0.0.1:8088/api/v1/hosts >/tmp/assert-hosts.json
            curl --fail --silent --show-error http://127.0.0.1:8088/api/v1/services >/tmp/assert-services.json
            curl --fail --silent --show-error http://127.0.0.1:8088/api/v1/meta >/tmp/assert-meta.json
            ASSERT_PHASE="$phase" node <<'NODE'
          const fs = require('node:fs')
          const assert = require('node:assert/strict')
          const phase = process.env.ASSERT_PHASE
          const hosts = JSON.parse(fs.readFileSync('/tmp/assert-hosts.json', 'utf8'))
          const services = JSON.parse(fs.readFileSync('/tmp/assert-services.json', 'utf8'))
          const meta = JSON.parse(fs.readFileSync('/tmp/assert-meta.json', 'utf8'))
          const fail = (field, actual, expected) => {
            assert.deepStrictEqual(actual, expected, `${phase} ${field}`)
          }
          fail('host', hosts.data.find(({ id }) => id === 'ci-host'), {
            id: 'ci-host', name: 'CI host', type: 'nas', ipAddress: '192.0.2.10', operatingSystem: 'Linux', notes: '',
            createdAt: '2026-08-04T00:00:00.000Z', updatedAt: '2026-08-04T00:00:00.000Z', revision: 1,
          })
          const dependency = services.data.find(({ id }) => id === 'ci-dependency')
          fail('dependency service id', dependency?.id, 'ci-dependency')
          fail('dependency service revision', dependency?.revision, 1)
          const service = services.data.find(({ id }) => id === 'ci-service')
          for (const [field, expected] of Object.entries({
            name: 'CI service', containerName: 'ci-service', dockerImage: 'example/ci:1', description: 'Container persistence proof',
            applicationUrl: 'https://ci.example.test', status: 'active', hostId: 'ci-host', internalUrl: 'http://ci-service:80',
            network: 'ci', exposure: 'reverse-proxy', notes: 'primary notes', createdAt: '2026-08-04T00:00:00.000Z',
            updatedAt: '2026-08-04T00:00:00.000Z', revision: 1,
          })) fail(`primary service ${field}`, service?.[field], expected)
          fail('primary service ports', service?.ports, [
            { id: 'web-http', hostPort: 8080, containerPort: 80, protocol: 'tcp', description: 'HTTP' },
            { id: 'discovery', hostPort: 1900, containerPort: 1900, protocol: 'udp', description: 'Discovery' },
          ])
          fail('primary service paths', service?.paths, [
            { id: 'config', hostPath: '/srv/ci/config', containerPath: '/config', purpose: 'Configuration', readOnly: false },
            { id: 'media', hostPath: '/srv/ci/media', containerPath: '/media', purpose: 'Media', readOnly: true },
          ])
          fail('primary service dependencies', service?.dependencyIds, ['ci-dependency'])
          if (!Number.isSafeInteger(hosts.meta.inventoryRevision) || hosts.meta.inventoryRevision < 3) throw new Error(`${phase} invalid host inventory revision`)
          fail('list inventory revisions', services.meta.inventoryRevision, hosts.meta.inventoryRevision)
          fail('meta inventory revision', meta.inventoryRevision, hosts.meta.inventoryRevision)
          fail('datastore authority', meta.datastoreAuthority, 'sqlite')
          NODE
          }
          assert_inventory 'immediately after creation'
          metadata_before_restart="$(docker exec stackmap-validation node -e "const Database=require('better-sqlite3'); const db=new Database('/config/stackmap.db',{readonly:true}); process.stdout.write(JSON.stringify(db.prepare('SELECT key,value FROM application_metadata ORDER BY key').all()))")"

          docker restart stackmap-validation >/dev/null
          wait_for_health
          persisted_id="$(curl --fail --silent --show-error http://127.0.0.1:8088/api/v1/meta | node -e "process.stdin.on('data',d=>process.stdout.write(JSON.parse(d).installationId))")"
          test "$persisted_id" = "$installation_id"
          metadata_after_restart="$(docker exec stackmap-validation node -e "const Database=require('better-sqlite3'); const db=new Database('/config/stackmap.db',{readonly:true}); process.stdout.write(JSON.stringify(db.prepare('SELECT key,value FROM application_metadata ORDER BY key').all()))")"
          test "$metadata_after_restart" = "$metadata_before_restart"
          migration_receipt_after_restart="$(docker exec stackmap-validation node -e "const Database=require('better-sqlite3');const db=new Database('/config/stackmap.db',{readonly:true});process.stdout.write(JSON.stringify(db.prepare('SELECT * FROM legacy_migration_receipt').get()))")"
          test "$migration_receipt_after_restart" = "$migration_receipt_before_restart"
          created_at_after_restart="$(docker exec stackmap-validation node -e "const Database=require('better-sqlite3'); const db=new Database('/config/stackmap.db',{readonly:true}); process.stdout.write(db.prepare(\"SELECT value FROM application_metadata WHERE key = 'created_at'\").pluck().get())")"
          test "$created_at_after_restart" = "$created_at_before_restore"
          assert_inventory 'after restart'

          docker rm --force stackmap-validation >/dev/null
          docker run --detach --name stackmap-validation --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true --mount "type=bind,source=$config_directory,target=/config" --publish 8088:8080 stackmap:validation
          wait_for_health
          created_at_after_recreation="$(docker exec stackmap-validation node -e "const Database=require('better-sqlite3'); const db=new Database('/config/stackmap.db',{readonly:true}); process.stdout.write(db.prepare(\"SELECT value FROM application_metadata WHERE key = 'created_at'\").pluck().get())")"
          test "$created_at_after_recreation" = "$created_at_before_restore"
          migration_receipt_after_recreation="$(docker exec stackmap-validation node -e "const Database=require('better-sqlite3');const db=new Database('/config/stackmap.db',{readonly:true});process.stdout.write(JSON.stringify(db.prepare('SELECT * FROM legacy_migration_receipt').get()))")"
          test "$migration_receipt_after_recreation" = "$migration_receipt_before_restart"
          assert_inventory 'after recreation'
          docker stop --time 10 stackmap-validation >/dev/null
          docker logs stackmap-validation > /tmp/stackmap-container.log 2>&1
          grep --quiet 'graceful shutdown started' /tmp/stackmap-container.log
          grep --quiet 'graceful shutdown completed' /tmp/stackmap-container.log

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        if: github.event_name == 'push'
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=StackMap
            org.opencontainers.image.description=A self-hosted homelab inventory application
            org.opencontainers.image.source=https://github.com/five2seven/stackmap

      - name: Publish image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
